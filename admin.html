<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Center | Geek Studio Tanzania</title>
  <link id="dyn-fav" rel="icon" type="image/png" href="logo-light.png">
  <script>
    (function(){
      var t=localStorage.getItem('gs-theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
      document.documentElement.setAttribute('data-theme',t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --ease: cubic-bezier(.16,1,.3,1);
      --f-display: 'Playfair Display', Georgia, serif;
      --f-body: 'Outfit', system-ui, sans-serif;
      --f-mono: 'JetBrains Mono', monospace;
      --ember: #C8401A;
      --ember-glow: rgba(200,64,26,.16);
      --ember-mid: rgba(200,64,26,.08);
      --gold: #B8956A;
      --tt: background .4s var(--ease), color .4s var(--ease), border-color .4s var(--ease), box-shadow .35s;
    }
    [data-theme="dark"] {
      --bg: #080706; --bg2: #0F0D0B; --bg3: #181512; --bg4: #201C18;
      --text: #EDE8DF; --text2: #A09890; --text3: #5C5650;
      --border: rgba(255,255,255,.055); --border-m: rgba(255,255,255,.11);
      --shadow: 0 4px 32px rgba(0,0,0,.6); --shadow-lg: 0 24px 80px rgba(0,0,0,.8);
      --sidebar: #0A0908; --card: rgba(18,15,12,.96);
      --success: #2D9B42; --warning: #D68C2A; --danger: #D63F38;
      --noise-op: .022; --noise-blend: screen;
    }
    [data-theme="light"] {
      --bg: #F5F2EE; --bg2: #EDEAE5; --bg3: #E2DDD7; --bg4: #D5CFC8;
      --text: #18150F; --text2: #504A42; --text3: #948E85;
      --border: rgba(0,0,0,.07); --border-m: rgba(0,0,0,.12);
      --shadow: 0 4px 32px rgba(0,0,0,.07); --shadow-lg: 0 24px 80px rgba(0,0,0,.12);
      --sidebar: #E8E5DE; --card: rgba(255,252,248,.98);
      --noise-op: .018; --noise-blend: multiply;
    }
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--f-body); background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased; height: 100vh; overflow: hidden;
      transition: var(--tt);
    }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }
    button { cursor: pointer; background: none; border: none; color: inherit; font-family: inherit; }
    input, select, textarea { font-family: var(--f-body); }
    ::selection { background: var(--ember); color: #fff; }

    /* Noise */
    .noise {
      position: fixed; inset: 0; pointer-events: none; z-index: 200;
      opacity: var(--noise-op); mix-blend-mode: var(--noise-blend);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      transition: opacity .4s;
    }

    /* Auth */
    #auth-screen {
      position: fixed; inset: 0; z-index: 999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; transition: var(--tt);
    }
    .auth-wrap { width: 100%; max-width: 420px; }
    .auth-card {
      background: var(--card); border: 1px solid var(--border-m);
      padding: 3rem 2.5rem; border-radius: 4px;
      position: relative; overflow: hidden; box-shadow: var(--shadow-lg);
    }
    .auth-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--ember);
    }
    .auth-logo {
      text-align: center; margin-bottom: 2rem;
      font-family: var(--f-display); font-style: italic;
      font-size: 2rem; font-weight: 400; color: var(--text);
    }
    .auth-tag {
      font-family: var(--f-mono); font-size: 9px; letter-spacing: .4em;
      text-transform: uppercase; color: var(--ember);
      text-align: center; display: block; margin-bottom: .5rem;
    }
    .auth-title {
      font-family: var(--f-display); font-size: 2.2rem; font-weight: 400;
      text-align: center; margin-bottom: 2rem; line-height: 1.05;
    }
    .auth-field { margin-bottom: 1.4rem; }
    .auth-flbl {
      font-family: var(--f-mono); font-size: 9px; letter-spacing: .22em;
      text-transform: uppercase; color: var(--text3);
      display: block; margin-bottom: .5rem;
    }
    .auth-inp {
      width: 100%; background: transparent; border: none; border-bottom: 1.5px solid var(--border-m);
      padding: .75rem 0; font-size: .95rem; color: var(--text); outline: none;
      transition: border-color .25s;
    }
    .auth-inp:focus { border-bottom-color: var(--ember); }
    .auth-inp::placeholder { color: var(--text3); }
    .auth-btn {
      width: 100%; padding: 1rem; background: var(--text); color: var(--bg);
      font-family: var(--f-mono); font-size: 10px; letter-spacing: .22em;
      text-transform: uppercase; border: none; cursor: pointer;
      margin-top: .5rem; transition: all .3s; border-radius: 2px;
    }
    .auth-btn:hover { background: var(--ember); color: #fff; }
    .auth-err {
      display: none; color: var(--danger); font-family: var(--f-mono);
      font-size: 9px; letter-spacing: .15em; text-transform: uppercase;
      text-align: center; margin-top: 1rem;
    }

    /* App Shell */
    #app { display: none; height: 100vh; overflow: hidden; }

    /* Sidebar */
    aside {
      width: 250px; flex-shrink: 0;
      background: var(--sidebar); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden; transition: var(--tt);
    }
    .sb-head {
      padding: 1.5rem 1.4rem; border-bottom: 1px solid var(--border);
    }
    .sb-logo {
      font-family: var(--f-display); font-style: italic;
      font-size: 1.4rem; font-weight: 400; color: var(--text); line-height: 1;
    }
    .sb-tagline {
      font-family: var(--f-mono); font-size: 8.5px; letter-spacing: .3em;
      text-transform: uppercase; color: var(--ember); margin-top: .2rem;
    }
    .sb-body { flex: 1; overflow-y: auto; padding: .8rem .6rem; }
    .sb-section { margin-bottom: 1.2rem; }
    .sb-section-lbl {
      font-family: var(--f-mono); font-size: 8px; letter-spacing: .32em;
      text-transform: uppercase; color: var(--text3);
      padding: .4rem .8rem; margin-bottom: .2rem;
    }
    .sb-link {
      display: flex; align-items: center; gap: .75rem;
      padding: .7rem .8rem; border-radius: 3px;
      font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--text2);
      transition: all .22s; cursor: pointer; border: 1px solid transparent;
    }
    .sb-link:hover { background: var(--ember-mid); color: var(--text); border-color: var(--border); }
    .sb-link.active { background: var(--ember-mid); color: var(--ember); border-color: rgba(200,64,26,.2); }
    .sb-link svg { width: 15px; height: 15px; flex-shrink: 0; }
    .sb-foot {
      padding: 1rem .8rem 1.4rem; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: .5rem;
    }
    .sb-foot-link {
      display: flex; align-items: center; gap: .75rem;
      padding: .6rem .8rem; border-radius: 3px;
      font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em;
      text-transform: uppercase; color: var(--text3); transition: all .22s;
    }
    .sb-foot-link:hover { color: var(--ember); background: var(--ember-mid); }
    .sb-foot-link svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* Mobile */
    #sb-toggle {
      display: none; position: fixed; bottom: 1.4rem; left: 1.4rem; z-index: 600;
      width: 44px; height: 44px; border-radius: 50%; background: var(--ember); color: #fff;
      box-shadow: var(--shadow-lg); align-items: center; justify-content: center;
    }
    #sb-toggle svg { width: 18px; height: 18px; }
    @media(max-width:768px) {
      #app { flex-direction: column; }
      aside {
        position: fixed; left: -250px; top: 0; bottom: 0; z-index: 700;
        transition: left .4s var(--ease);
      }
      aside.open { left: 0; }
      #sb-toggle { display: flex; }
    }

    /* Main Content */
    main { flex: 1; overflow-y: auto; background: var(--bg); transition: var(--tt); }
    .main-inner { max-width: 1300px; margin: 0 auto; padding: 2rem 2.5rem; }
    @media(max-width:768px) { .main-inner { padding: 1.2rem; } }

    /* Topbar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 1.5rem; border-bottom: 1px solid var(--border);
      margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;
    }
    .tb-left {}
    .tb-title {
      font-family: var(--f-display); font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 400; line-height: 1.05;
    }
    .tb-sub {
      font-family: var(--f-mono); font-size: 9px; letter-spacing: .28em;
      text-transform: uppercase; color: var(--text3); margin-top: .3rem;
    }
    .tb-actions { display: flex; gap: .7rem; align-items: center; }
    .btn {
      display: flex; align-items: center; gap: .5rem;
      padding: .6rem 1.3rem;
      font-family: var(--f-mono); font-size: 10px; letter-spacing: .14em;
      text-transform: uppercase; border-radius: 2px; transition: all .25s;
    }
    .btn-primary { background: var(--ember); color: #fff; }
    .btn-primary:hover { background: #a83416; transform: translateY(-1px); }
    .btn-secondary { border: 1px solid var(--border-m); color: var(--text2); }
    .btn-secondary:hover { border-color: var(--ember); color: var(--ember); }
    .btn-sm { padding: .4rem .9rem; font-size: 9px; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #b8302a; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #237a34; }
    .btn svg { width: 14px; height: 14px; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem; margin-bottom: 2rem; }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      padding: 1.4rem 1.5rem; border-radius: 3px;
      transition: var(--tt), box-shadow .3s, transform .3s; position: relative; overflow: hidden;
    }
    .stat-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
    .stat-card::after {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
      background: transparent; transition: background .3s;
    }
    .stat-card:hover::after { background: var(--ember); }
    .stat-label { font-family: var(--f-mono); font-size: 8.5px; letter-spacing: .26em; text-transform: uppercase; color: var(--text3); margin-bottom: .5rem; }
    .stat-value { font-family: var(--f-display); font-size: 2.2rem; font-weight: 400; color: var(--text); line-height: 1; }
    .stat-sub { font-size: .8rem; color: var(--text3); margin-top: .3rem; }
    @media(max-width:900px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
    @media(max-width:480px) { .stats-grid { grid-template-columns: 1fr; } }

    /* Content Panel */
    .panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 3px; margin-bottom: 2rem; overflow: hidden;
    }
    .panel-header {
      padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    }
    .panel-title { font-size: .95rem; font-weight: 600; color: var(--text); }
    .panel-body { padding: 1.5rem; }
    .panel-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: .7rem; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: .9rem 1rem;
      font-family: var(--f-mono); font-size: 8.5px; letter-spacing: .2em;
      text-transform: uppercase; color: var(--text3);
      border-bottom: 1px solid var(--border); font-weight: 400;
    }
    td {
      padding: .9rem 1rem; border-bottom: 1px solid var(--border);
      font-size: .88rem; color: var(--text2);
    }
    tr:hover td { background: var(--bg2); }
    .td-actions { display: flex; gap: .4rem; }
    .td-badge {
      display: inline-block; padding: .2rem .7rem; border-radius: 2px;
      font-family: var(--f-mono); font-size: 8px; letter-spacing: .14em;
      text-transform: uppercase;
    }
    .badge-portfolio { background: var(--ember-mid); color: var(--ember); }
    .badge-featured { background: rgba(184,149,106,.15); color: var(--gold); }
    .badge-blog { background: rgba(45,155,66,.15); color: var(--success); }

    /* Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    .form-full { grid-column: 1 / -1; }
    .form-group { display: flex; flex-direction: column; gap: .4rem; }
    .form-label {
      font-family: var(--f-mono); font-size: 9px; letter-spacing: .18em;
      text-transform: uppercase; color: var(--text3);
    }
    .form-input, .form-textarea, .form-select {
      width: 100%; background: transparent; border: 1px solid var(--border-m);
      padding: .7rem 1rem; font-size: .9rem; color: var(--text);
      outline: none; transition: border-color .25s; border-radius: 2px;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--ember); }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--text3); }
    .form-textarea { resize: vertical; min-height: 100px; }
    .form-select { background: var(--bg3); appearance: none; cursor: pointer; }
    .form-hint { font-size: .75rem; color: var(--text3); margin-top: .2rem; }

    /* Media Grid */
    .media-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem; }
    .media-item {
      aspect-ratio: 1; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 3px; overflow: hidden; position: relative; cursor: pointer;
      transition: border-color .25s, box-shadow .25s;
    }
    .media-item:hover { border-color: var(--ember); box-shadow: var(--shadow); }
    .media-item img { width: 100%; height: 100%; object-fit: cover; }
    .media-item-overlay {
      position: absolute; inset: 0; background: rgba(8,7,6,.7);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .25s;
    }
    .media-item:hover .media-item-overlay { opacity: 1; }
    .media-item-name {
      font-family: var(--f-mono); font-size: 8px; letter-spacing: .15em;
      color: var(--text); text-align: center; padding: .3rem;
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(8,7,6,.8);
      text-transform: uppercase;
    }
    @media(max-width:900px) { .media-grid { grid-template-columns: repeat(3, 1fr); } }
    @media(max-width:480px) { .media-grid { grid-template-columns: repeat(2, 1fr); } }

    /* Live Preview Frame */
    .preview-frame {
      width: 100%; height: 500px; border: 1px solid var(--border);
      border-radius: 3px; background: #fff; overflow: hidden;
    }
    .preview-frame iframe { width: 100%; height: 100%; border: none; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 900;
      background: rgba(8,7,6,.9); backdrop-filter: blur(16px);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .35s, visibility .35s;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; pointer-events: auto; }
    .modal {
      background: var(--card); border: 1px solid var(--border-m);
      border-radius: 4px; width: 100%; max-width: 650px; max-height: 85vh;
      overflow-y: auto; box-shadow: var(--shadow-lg); position: relative;
    }
    .modal-header {
      padding: 1.5rem 1.8rem; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background: var(--card); z-index: 2;
    }
    .modal-title {
      font-family: var(--f-display); font-size: 1.5rem; font-weight: 400;
    }
    .modal-close {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-m);
      display: flex; align-items: center; justify-content: center;
      color: var(--text3); transition: all .25s;
    }
    .modal-close:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    .modal-body { padding: 1.8rem; }
    .modal-footer { padding: 1.2rem 1.8rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: .7rem; }

    /* Toast */
    .toast-container {
      position: fixed; top: 1.5rem; right: 1.5rem; z-index: 950;
      display: flex; flex-direction: column; gap: .6rem;
    }
    .toast {
      padding: 1rem 1.5rem; border-radius: 3px;
      font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em;
      text-transform: uppercase; color: #fff;
      animation: slideIn .3s var(--ease);
      box-shadow: var(--shadow);
    }
    .toast-success { background: var(--success); }
    .toast-error { background: var(--danger); }
    .toast-info { background: var(--text3); }
    @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

    /* Loading Spinner */
    .spinner {
      width: 20px; height: 20px; border: 2px solid var(--border-m);
      border-top-color: var(--ember); border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty State */
    .empty-state {
      text-align: center; padding: 4rem 2rem;
    }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: .4; }
    .empty-text {
      font-family: var(--f-mono); font-size: 10px; letter-spacing: .2em;
      text-transform: uppercase; color: var(--text3);
    }

    /* Tabs */
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
    .tab {
      padding: .8rem 1.5rem; font-family: var(--f-mono); font-size: 9.5px;
      letter-spacing: .15em; text-transform: uppercase; color: var(--text3);
      border-bottom: 2px solid transparent; transition: all .25s; cursor: pointer;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--ember); border-bottom-color: var(--ember); }

    /* Search */
    .search-bar {
      display: flex; gap: .5rem; margin-bottom: 1.2rem;
    }
    .search-input {
      flex: 1; background: transparent; border: 1px solid var(--border-m);
      padding: .6rem 1rem; font-size: .88rem; color: var(--text);
      outline: none; border-radius: 2px; transition: border-color .25s;
    }
    .search-input:focus { border-color: var(--ember); }
    .search-input::placeholder { color: var(--text3); }

    /* Blog Card */
    .blog-card {
      background: var(--card); border: 1px solid var(--border);
      padding: 1.5rem; border-radius: 3px; margin-bottom: 1rem;
      transition: box-shadow .3s;
    }
    .blog-card:hover { box-shadow: var(--shadow); }
    .blog-card-title { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: .4rem; }
    .blog-card-meta { font-family: var(--f-mono); font-size: 8.5px; letter-spacing: .15em; color: var(--text3); text-transform: uppercase; }
    .blog-card-excerpt { color: var(--text2); font-size: .85rem; line-height: 1.6; margin-top: .8rem; }
    .blog-card-actions { display: flex; gap: .5rem; margin-top: 1rem; }
  </style>
</head>
<body>

<div class="noise" aria-hidden="true"></div>
<div class="toast-container" id="toast-container"></div>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">Geek Studio</div>
      <span class="auth-tag">Command Center</span>
      <h1 class="auth-title">Authenticate.</h1>
      <form id="login-form" autocomplete="on">
        <div class="auth-field">
          <label class="auth-flbl" for="email">Admin Email</label>
          <input type="email" id="email" class="auth-inp" placeholder="admin@geekstudio.co.tz" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label class="auth-flbl" for="password">Password</label>
          <input type="password" id="password" class="auth-inp" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="auth-btn">Enter Command Center →</button>
        <p class="auth-err" id="auth-error"></p>
      </form>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:flex;">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">Geek Studio</div>
      <span class="sb-tagline">Command Center</span>
    </div>
    <div class="sb-body">
      <div class="sb-section">
        <div class="sb-section-lbl">Content</div>
        <div class="sb-link active" data-panel="dashboard">

async function loadPortfolio() {

    console.error(e);

  }

  main.innerHTML = `
    <div class="topbar">
      <div class="tb-left">

                <th>Category</th>
                <th>Type</th>

                <th>Date</th>

                  <td><strong>${p.title || 'Untitled'}</strong></td>
                  <td><span class="td-badge badge-portfolio">${p.category || 'Uncategorized'}</span></td>
                  <td><span class="td-badge ${p.type === 'featured' ? 'badge-featured' : 'badge-portfolio'}">${p.type || 'portfolio'}</span></td>

function filterPortfolioTable() {
  const query = document.getElementById('portfolio-search').value.toLowerCase();

    const title = row.dataset.title || '';
    const category = row.dataset.category || '';
    row.style.display = title.includes(query) || category.includes(query) ? '' : 'none';
  });
}

async function saveProject() {
  const title = document.getElementById('proj-title').value.trim();
  const category = document.getElementById('proj-category').value.trim();
  const image_url = document.getElementById('proj-image-url').value.trim();
  const video_url = document.getElementById('proj-video-url').value.trim();
  const type = document.getElementById('proj-type').value;
  const link = document.getElementById('proj-link').value.trim();

  if (!title || !category) { toast('Title and category are required', 'error'); return; }

  try {
    if (editingId) {
      const { error } = await supabase.from('projects').update({ title, category, image_url, video_url, type, link }).eq('id', editingId);
      if (error) throw error;
      toast('Project updated!', 'success');
    } else {
      const { error } = await supabase.from('projects').insert([{ title, category, image_url, video_url, type, link }]);
      if (error) throw error;
      toast('Project created!', 'success');
    }
    closeModal();
    loadPortfolio();
  } catch(e) {
    toast('Error saving project', 'error');
    console.error(e);
  }
}

async function editProject(id) {
  try {
    const { data, error } = await supabase.from('projects').select('*').eq('id', id).single();
    if (error) throw error;
    editingId = id;
    editingType = 'project';
    openModal('Edit Project', `
      <form id="project-form">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Project Title *</label>
            <input type="text" class="form-input" id="proj-title" value="${data.title || ''}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Category *</label>
            <input type="text" class="form-input" id="proj-category" value="${data.category || ''}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Image URL</label>
            <input type="text" class="form-input" id="proj-image-url" value="${data.image_url || ''}">
          </div>
          <div class="form-group">
            <label class="form-label">Video URL</label>
            <input type="text" class="form-input" id="proj-video-url" value="${data.video_url || ''}">
          </div>
          <div class="form-group">
            <label class="form-label">Type</label>
            <select class="form-select" id="proj-type">
              <option value="portfolio" ${data.type === 'portfolio' ? 'selected' : ''}>Portfolio</option>
              <option value="featured" ${data.type === 'featured' ? 'selected' : ''}>Featured</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Live Link</label>
            <input type="text" class="form-input" id="proj-link" value="${data.link || ''}">
          </div>
        </div>
      </form>
    `, `
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveProject()">Update Project</button>
    `);
  } catch(e) {
    toast('Error loading project', 'error');
  }
}

async function deleteProject(id) {
  if (!confirm('Delete this project? This cannot be undone.')) return;
  try {
    const { error } = await supabase.from('projects').delete().eq('id', id);
    if (error) throw error;
    toast('Project deleted', 'success');
    loadPortfolio();
  } catch(e) {
    toast('Error deleting', 'error');
  }
}

          ${media.length === 0 ? `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">🖼</div><p class="empty-text">No media uploaded yet</p></div>` :
          media.map(m => `
            <div class="media-item" data-name="${(m.name||'').toLowerCase()}" onclick="copyMediaUrl('${m.url}')" title="Click to copy URL">
              <img src="${m.url}" alt="${m.name}" onerror="this.style.display='none';this.parentElement.innerHTML='<div style=display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3)>📁</div>'">
              <div class="media-item-overlay">
                <span style="font-family:var(--f-mono);font-size:9px;color:#fff;">Copy URL</span>
              </div>
              <div class="media-item-name">${m.name || 'Untitled'}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function filterMediaGrid() {
  const query = document.getElementById('media-search').value.toLowerCase();
  document.querySelectorAll('#media-grid .media-item').forEach(item => {
    item.style.display = (item.dataset.name || '').includes(query) ? '' : 'none';
  });
}

function copyMediaUrl(url) {
  navigator.clipboard.writeText(url).then(() => toast('URL copied to clipboard!', 'success'));
}

function openAddMediaModal() {
  openModal('Upload Media', `
    <form id="media-form">
      <div class="form-group">
        <label class="form-label">Media Name</label>
        <input type="text" class="form-input" id="media-name" placeholder="e.g. hero-banner-01" required>
      </div>
      <div class="form-group">
        <label class="form-label">Image/Video URL</label>
        <input type="text" class="form-input" id="media-url" placeholder="https://..." required>
        <p class="form-hint">Upload to Supabase Storage or use any direct image/video URL</p>
      </div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <select class="form-select" id="media-type">
          <option value="image">Image</option>
          <option value="video">Video</option>
        </select>
      </div>
    </form>
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveMedia()">Add Media</button>
  `);
}

async function saveMedia() {
  const name = document.getElementById('media-name').value.trim();
  const url = document.getElementById('media-url').value.trim();
  const type = document.getElementById('media-type').value;
  if (!name || !url) { toast('Name and URL required', 'error'); return; }
  try {
    const { error } = await supabase.from('media').insert([{ name, url, type }]);
    if (error) throw error;
    toast('Media added!', 'success');
    closeModal();
    loadMedia();
  } catch(e) {
    toast('Error adding media', 'error');
  }
}

// ═══════════════════════════════════════════
// BLOG SYSTEM
// ═══════════════════════════════════════════
async function loadBlog() {
  const main = document.getElementById('main-content');
  
  let posts = [];
  try {
    const { data, error } = await supabase.from('blog_posts').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    posts = data || [];
  } catch(e) {
    console.error(e);
  }

  main.innerHTML = `
    <div class="topbar">
      <div class="tb-left">
        <h2 class="tb-title">Blog</h2>
        <p class="tb-sub">${posts.length} published posts</p>
      </div>
      <div class="tb-actions">
        <button class="btn btn-primary" onclick="openAddBlogModal()">+ New Post</button>
      </div>
    </div>
    ${posts.length === 0 ? `<div class="empty-state"><div class="empty-icon">✍️</div><p class="empty-text">No blog posts yet. Start writing.</p></div>` :
    posts.map(p => `
      <div class="blog-card">
        <h4 class="blog-card-title">${p.title || 'Untitled'}</h4>
        <span class="blog-card-meta">${new Date(p.created_at).toLocaleDateString()} · ${p.status || 'draft'}</span>
        <p class="blog-card-excerpt">${(p.content || '').substring(0, 200)}...</p>
        <div class="blog-card-actions">
          <button class="btn btn-sm btn-secondary" onclick="editBlogPost('${p.id}')">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteBlogPost('${p.id}')">Delete</button>
        </div>
      </div>
    `).join('')}
  `;
}

function openAddBlogModal() {
  editingId = null;
  editingType = 'blog';
  openModal('New Blog Post', `
    <form id="blog-form">
      <div class="form-group" style="margin-bottom:1rem;">
        <label class="form-label">Title *</label>
        <input type="text" class="form-input" id="blog-title" placeholder="Post title..." required>
      </div>
      <div class="form-group" style="margin-bottom:1rem;">
        <label class="form-label">Excerpt</label>
        <input type="text" class="form-input" id="blog-excerpt" placeholder="Brief summary...">
      </div>
      <div class="form-group" style="margin-bottom:1rem;">
        <label class="form-label">Content *</label>
        <textarea class="form-textarea" id="blog-content" placeholder="Write your post... HTML supported" rows="10" required></textarea>
      </div>
      <div class="form-group" style="margin-bottom:1rem;">
        <label class="form-label">Featured Image URL</label>
        <input type="text" class="form-input" id="blog-image" placeholder="https://...">
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="blog-status">
          <option value="published">Published</option>
          <option value="draft">Draft</option>
        </select>
      </div>
    </form>
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveBlogPost()">Save Post</button>
  `);
}

async function saveBlogPost() {
  const title = document.getElementById('blog-title').value.trim();
  const excerpt = document.getElementById('blog-excerpt').value.trim();
  const content = document.getElementById('blog-content').value.trim();
  const image_url = document.getElementById('blog-image').value.trim();
  const status = document.getElementById('blog-status').value;
  if (!title || !content) { toast('Title and content required', 'error'); return; }
  try {
    if (editingId) {
      const { error } = await supabase.from('blog_posts').update({ title, excerpt, content, image_url, status }).eq('id', editingId);
      if (error) throw error;
      toast('Post updated!', 'success');
    } else {
      const { error } = await supabase.from('blog_posts').insert([{ title, excerpt, content, image_url, status }]);
      if (error) throw error;
      toast('Post published!', 'success');
    }
    closeModal();
    loadBlog();
  } catch(e) {
    toast('Error saving post', 'error');
  }
}

async function editBlogPost(id) {
  try {
    const { data, error } = await supabase.from('blog_posts').select('*').eq('id', id).single();
    if (error) throw error;
    editingId = id;
    editingType = 'blog';
    openModal('Edit Post', `
      <form id="blog-form">
        <div class="form-group" style="margin-bottom:1rem;">
          <label class="form-label">Title *</label>
          <input type="text" class="form-input" id="blog-title" value="${data.title || ''}" required>
        </div>
        <div class="form-group" style="margin-bottom:1rem;">
          <label class="form-label">Excerpt</label>
          <input type="text" class="form-input" id="blog-excerpt" value="${data.excerpt || ''}">
        </div>
        <div class="form-group" style="margin-bottom:1rem;">
          <label class="form-label">Content *</label>
          <textarea class="form-textarea" id="blog-content" rows="10" required>${data.content || ''}</textarea>
        </div>
        <div class="form-group" style="margin-bottom:1rem;">
          <label class="form-label">Featured Image URL</label>
          <input type="text" class="form-input" id="blog-image" value="${data.image_url || ''}">
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-select" id="blog-status">
            <option value="published" ${data.status === 'published' ? 'selected' : ''}>Published</option>
            <option value="draft" ${data.status === 'draft' ? 'selected' : ''}>Draft</option>
          </select>
        </div>
      </form>
    `, `
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveBlogPost()">Update Post</button>
    `);
  } catch(e) {
    toast('Error loading post', 'error');
  }
}

async function deleteBlogPost(id) {
  if (!confirm('Delete this post?')) return;
  try {
    const { error } = await supabase.from('blog_posts').delete().eq('id', id);
    if (error) throw error;
    toast('Post deleted', 'success');
    loadBlog();
  } catch(e) {
    toast('Error deleting', 'error');
  }
}

// ═══════════════════════════════════════════
// SERVICES MANAGER
// ═══════════════════════════════════════════
async function loadServicesManager() {
  const main = document.getElementById('main-content');
  
  let services = [];
  try {
    const { data, error } = await supabase.from('services').select('*').order('id', { ascending: true });
    if (error) throw error;
    services = data || [];
  } catch(e) {
    console.error(e);
  }

  main.innerHTML = `
    <div class="topbar">
      <div class="tb-left">
        <h2 class="tb-title">Services Manager</h2>
        <p class="tb-sub">${services.length} services · Edit descriptions, icons, and details</p>
      </div>
      <div class="tb-actions">
        <button class="btn btn-primary" onclick="openAddServiceModal()">+ New Service</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Icon</th><th>Name</th><th>Description</th><th>Category</th><th>Actions</th></tr>
        </thead>
        <tbody>
          ${services.length === 0 ? `<tr><td colspan="5"><div class="empty-state"><p class="empty-text">No services yet</p></div></td></tr>` :
          services.map(s => `
            <tr>
              <td style="font-size:1.4rem;">${s.icon || '⚡'}</td>
              <td><strong>${s.name || 'Untitled'}</strong></td>
              <td style="max-width:300px;">${(s.description || '').substring(0, 100)}...</td>
              <td><span class="td-badge badge-portfolio">${s.category || 'General'}</span></td>
              <td class="td-actions">
                <button class="btn btn-sm btn-secondary" onclick="editService('${s.id}')">Edit</button>
                <button class="btn btn-sm btn-danger" onclick="deleteService('${s.id}')">Delete</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function openAddServiceModal() {
  editingId = null;
  editingType = 'service';
  openModal('New Service', `
    <form id="service-form">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Icon (emoji)</label><input type="text" class="form-input" id="svc-icon" placeholder="⚡"></div>
        <div class="form-group"><label class="form-label">Name *</label><input type="text" class="form-input" id="svc-name" placeholder="Creative Systems" required></div>
        <div class="form-group form-full"><label class="form-label">Description</label><textarea class="form-textarea" id="svc-desc" placeholder="Service description..."></textarea></div>
        <div class="form-group"><label class="form-label">Category</label><input type="text" class="form-input" id="svc-category" placeholder="Creative, Digital, Growth, Startup"></div>
      </div>
    </form>
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveService()">Save Service</button>
  `);
}

async function saveService() {
  const name = document.getElementById('svc-name').value.trim();
  const description = document.getElementById('svc-desc').value.trim();
  const icon = document.getElementById('svc-icon').value.trim();
  const category = document.getElementById('svc-category').value.trim();
  if (!name) { toast('Name required', 'error'); return; }
  try {
    if (editingId) {
      await supabase.from('services').update({ name, description, icon, category }).eq('id', editingId);
    } else {
      await supabase.from('services').insert([{ name, description, icon, category }]);
    }
    toast('Service saved!', 'success');
    closeModal();
    loadServicesManager();
  } catch(e) {
    toast('Error saving', 'error');
  }
}

async function editService(id) {
  const { data } = await supabase.from('services').select('*').eq('id', id).single();
  editingId = id;
  editingType = 'service';
  openModal('Edit Service', `
    <form id="service-form">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Icon</label><input type="text" class="form-input" id="svc-icon" value="${data.icon || ''}"></div>
        <div class="form-group"><label class="form-label">Name *</label><input type="text" class="form-input" id="svc-name" value="${data.name || ''}" required></div>
        <div class="form-group form-full"><label class="form-label">Description</label><textarea class="form-textarea" id="svc-desc">${data.description || ''}</textarea></div>
        <div class="form-group"><label class="form-label">Category</label><input type="text" class="form-input" id="svc-category" value="${data.category || ''}"></div>
      </div>
    </form>
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveService()">Update</button>
  `);
}

async function deleteService(id) {
  if (!confirm('Delete this service?')) return;
  await supabase.from('services').delete().eq('id', id);
  toast('Service deleted', 'success');
  loadServicesManager();
}

// ═══════════════════════════════════════════
// SITE CONTENT EDITOR
// ═══════════════════════════════════════════
async function loadContentEditor() {
  const main = document.getElementById('main-content');
  
  let content = {};
  try {
    const { data, error } = await supabase.from('site_content').select('*').single();
    if (data) content = data;
  } catch(e) {}

  main.innerHTML = `
    <div class="topbar">
      <div class="tb-left">
        <h2 class="tb-title">Site Content Editor</h2>
        <p class="tb-sub">Edit homepage text, hero messaging, about section, and more</p>
      </div>
      <div class="tb-actions">
        <button class="btn btn-primary" onclick="saveContent()">Save Changes</button>
        <a href="index.html" target="_blank" class="btn btn-secondary">Preview Site ↗</a>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><h3 class="panel-title">Hero Section</h3></div>
      <div class="panel-body">
        <div class="form-group" style="margin-bottom:1rem;">
          <label class="form-label">Hero Headline</label>
          <input type="text" class="form-input" id="content-hero-headline" value="${content.hero_headline || 'Designing the Future of African Business.'}">
        </div>
        <div class="form-group" style="margin-bottom:1rem;">
          <label class="form-label">Hero Subtitle</label>
          <input type="text" class="form-input" id="content-hero-sub" value="${content.hero_sub || 'Built in Tanzania'}">
        </div>
        <div class="form-group" style="margin-bottom:1rem;">
          <label class="form-label">Hero Video URL</label>
          <input type="text" class="form-input" id="content-hero-video" value="${content.hero_video || 'geekstudio-hero1.mp4'}">
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><h3 class="panel-title">About Section</h3></div>
      <div class="panel-body">
        <div class="form-group" style="margin-bottom:1rem;">
          <label class="form-label">Section Title</label>
          <input type="text" class="form-input" id="content-about-title" value="${content.about_title || 'Not just an agency. An ecosystem.'}">
        </div>
        <div class="form-group" style="margin-bottom:1rem;">
          <label class="form-label">About Text</label>
          <textarea class="form-textarea" id="content-about-text">${content.about_text || 'Geek Studio is a future-focused creative-tech ecosystem...'}</textarea>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><h3 class="panel-title">Footer</h3></div>
      <div class="panel-body">
        <div class="form-group" style="margin-bottom:1rem;">
          <label class="form-label">Footer Tagline</label>
          <input type="text" class="form-input" id="content-footer-tagline" value="${content.footer_tagline || 'Built in Tanzania. Designed for the Future.'}">
        </div>
      </div>
    </div>
  `;
}

async function saveContent() {
  const data = {
    hero_headline: document.getElementById('content-hero-headline').value,
    hero_sub: document.getElementById('content-hero-sub').value,
    hero_video: document.getElementById('content-hero-video').value,
    about_title: document.getElementById('content-about-title').value,
    about_text: document.getElementById('content-about-text').value,
    footer_tagline: document.getElementById('content-footer-tagline').value,
  };
  try {
    // Upsert
    const { error } = await supabase.from('site_content').upsert([{ id: 1, ...data }]);
    if (error) throw error;
    toast('Content saved! Changes are live.', 'success');
  } catch(e) {
    toast('Error saving content', 'error');
  }
}

// ═══════════════════════════════════════════
// INITIALIZE
// ═══════════════════════════════════════════
// Create tables if they don't exist (will fail silently if they do)
async function initDB() {
  try {
    // Projects table
    await supabase.rpc('create_projects_table').maybeSingle();
  } catch(e) {}
  try {
    // Media table
    await supabase.rpc('create_media_table').maybeSingle();
  } catch(e) {}
  try {
    // Blog posts table
    await supabase.rpc('create_blog_table').maybeSingle();
  } catch(e) {}
  try {
    // Services table
    await supabase.rpc('create_services_table').maybeSingle();
  } catch(e) {}
  try {
    // Site content table
    await supabase.rpc('create_content_table').maybeSingle();
  } catch(e) {}
}

// Run init
initDB();
</script>
</body>
