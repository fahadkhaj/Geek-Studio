<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Center | Geek Studio Tanzania</title>
  <link id="dyn-fav" rel="icon" type="image/png" href="logo-light.png">
  <script>
    (function(){
      var t=localStorage.getItem('gs-theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
      document.documentElement.setAttribute('data-theme',t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Syne+Mono:wght@400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --ease:cubic-bezier(.16,1,.3,1);
      --f-serif:'Cormorant Garamond',Georgia,serif;
      --f-sans:'DM Sans',system-ui,sans-serif;
      --f-mono:'Syne Mono',monospace;
      --red:#D63F38;--rdim:rgba(214,63,56,.12);
      --tt:background .4s var(--ease),color .4s var(--ease),border-color .4s var(--ease),box-shadow .35s;
    }
    [data-theme="dark"]{
      --bg:#0B0A09;--bg2:#141210;--bg3:#1E1B18;--bg4:#252320;
      --text:#F0EDE6;--text2:#B0ADA8;--text3:#72706A;
      --border:rgba(255,255,255,.07);--border-m:rgba(255,255,255,.13);
      --shadow:0 4px 24px rgba(0,0,0,.55);--shadow-lg:0 16px 50px rgba(0,0,0,.75);
      --sidebar:#0D0B09;--card:rgba(22,20,17,.96);
      --success:#2D9B42;--danger:#D63F38;
      --noise-op:.022;--noise-blend:screen;
    }
    [data-theme="light"]{
      --bg:#F5F2EC;--bg2:#EBE8E0;--bg3:#E0DDD5;--bg4:#D6D3CB;
      --text:#141210;--text2:#52504C;--text3:#9A9790;
      --border:rgba(0,0,0,.08);--border-m:rgba(0,0,0,.15);
      --shadow:0 4px 24px rgba(0,0,0,.07);--shadow-lg:0 16px 50px rgba(0,0,0,.11);
      --sidebar:#E4E1D9;--card:rgba(255,253,249,.98);
      --noise-op:.03;--noise-blend:multiply;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{font-size:17px;}
    body{
      font-family:var(--f-sans);
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      height:100vh;overflow:hidden;
      transition:var(--tt);
    }
    a{text-decoration:none;color:inherit;}
    img{display:block;max-width:100%;}
    button{cursor:pointer;background:none;border:none;color:inherit;font-family:inherit;}
    input,select,textarea{font-family:var(--f-sans);}
    ::selection{background:var(--red);color:#fff;}

    .noise{
      position:fixed;inset:0;pointer-events:none;z-index:200;
      opacity:var(--noise-op);mix-blend-mode:var(--noise-blend);
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      transition:opacity .4s;
    }

    /* AUTH SCREEN */
    #auth-screen{
      position:fixed;inset:0;z-index:999;
      background:var(--bg);
      display:flex;align-items:center;justify-content:center;
      padding:1.5rem;
      transition:var(--tt);
    }
    .auth-wrap{width:100%;max-width:400px;}
    .auth-logo{text-align:center;margin-bottom:2.5rem;}
    .auth-logo span{
      font-family:var(--f-serif);font-style:italic;
      font-size:2.2rem;font-weight:300;color:var(--text);
    }
    .auth-card{
      background:var(--card);border:1px solid var(--border-m);
      padding:2.8rem 2.6rem;border-radius:6px;
      position:relative;overflow:hidden;
      box-shadow:var(--shadow-lg);
    }
    .auth-card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--red);
    }
    .auth-tag{
      font-family:var(--f-mono);font-size:10px;letter-spacing:.38em;
      text-transform:uppercase;color:var(--red);
      text-align:center;display:block;margin-bottom:.6rem;
    }
    .auth-title{
      font-family:var(--f-serif);font-size:2.6rem;font-weight:300;
      text-align:center;margin-bottom:2.5rem;line-height:1.05;
    }
    .auth-field{margin-bottom:1.5rem;}
    .auth-flbl{
      font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;
      text-transform:uppercase;color:var(--text3);
      display:block;margin-bottom:.5rem;
    }
    .auth-inp{
      width:100%;background:transparent;border:none;border-bottom:1.5px solid var(--border-m);
      padding:.8rem 0;font-size:1rem;color:var(--text);outline:none;
      transition:border-color .25s;
    }
    .auth-inp:focus{border-bottom-color:var(--red);}
    .auth-inp::placeholder{color:var(--text3);}
    .auth-btn{
      width:100%;padding:1.05rem;background:var(--text);color:var(--bg);
      font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;
      text-transform:uppercase;border:none;cursor:pointer;
      margin-top:.5rem;transition:all .3s;border-radius:3px;
    }
    .auth-btn:hover{background:var(--red);color:#fff;}
    .auth-err{
      display:none;color:var(--red);font-family:var(--f-mono);
      font-size:10px;letter-spacing:.15em;text-transform:uppercase;
      text-align:center;margin-top:1.2rem;
    }

    /* APP SHELL */
    #app{display:none;height:100vh;overflow:hidden;}

    /* SIDEBAR */
    aside{
      width:260px;flex-shrink:0;
      background:var(--sidebar);
      border-right:1px solid var(--border);
      display:flex;flex-direction:column;
      padding:0;overflow:hidden;
      transition:var(--tt);
    }
    .sb-head{padding:1.6rem 1.6rem 1.4rem;border-bottom:1px solid var(--border);}
    .sb-logo{
      font-family:var(--f-serif);font-style:italic;font-size:1.8rem;font-weight:300;
      color:var(--text);line-height:1;
    }
    .sb-tagline{
      font-family:var(--f-mono);font-size:9.5px;letter-spacing:.32em;
      text-transform:uppercase;color:var(--red);
    }
    .sb-body{flex:1;overflow-y:auto;padding:1rem .8rem;}
    .sb-section{margin-bottom:1.5rem;}
    .sb-section-lbl{
      font-family:var(--f-mono);font-size:9px;letter-spacing:.3em;
      text-transform:uppercase;color:var(--text3);
      padding:.4rem .8rem;margin-bottom:.3rem;
    }
    .sb-link{
      display:flex;align-items:center;gap:.85rem;
      padding:.75rem .85rem;border-radius:4px;
      font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
      color:var(--text2);transition:all .22s;cursor:pointer;
      border:1px solid transparent;
    }
    .sb-link:hover{background:var(--rdim);color:var(--text);border-color:var(--border);}
    .sb-link.active{background:var(--rdim);color:var(--red);border-color:rgba(214,63,56,.2);}
    .sb-link svg{width:16px;height:16px;flex-shrink:0;}

    .sb-foot{
      padding:1.2rem .8rem 1.6rem;border-top:1px solid var(--border);
      display:flex;flex-direction:column;gap:.6rem;
    }
    .sb-foot-btn{
      display:flex;align-items:center;gap:.85rem;
      padding:.65rem .85rem;border-radius:4px;
      font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
      color:var(--text3);transition:all .22s;
    }
    .sb-foot-btn:hover{color:var(--red);background:var(--rdim);}
    .sb-foot-btn svg{width:16px;height:16px;flex-shrink:0;}

    #sb-toggle{
      display:none;position:fixed;bottom:1.4rem;left:1.4rem;z-index:600;
      width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;
      box-shadow:var(--shadow-lg);align-items:center;justify-content:center;
    }
    #sb-toggle svg{width:20px;height:20px;}

    @media(max-width:768px){
      #app{flex-direction:column;}
      aside{
        position:fixed;left:-260px;top:0;bottom:0;z-index:700;
        transition:left .4s var(--ease);
      }
      aside.open{left:0;}
      #sb-toggle{display:flex;}
    }

    /* MAIN */
    main{flex:1;overflow-y:auto;background:var(--bg);transition:var(--tt);}
    .main-inner{max-width:1200px;margin:0 auto;padding:2.4rem 2.8rem;}

    .topbar{
      display:flex;align-items:center;justify-content:space-between;
      padding-bottom:2rem;border-bottom:1px solid var(--border);
      margin-bottom:2.4rem;flex-wrap:wrap;gap:1.2rem;
    }
    .tb-title{
      font-family:var(--f-serif);font-size:clamp(2rem,3.5vw,2.8rem);
      font-weight:300;line-height:1.05;
    }
    .tb-sub{
      font-family:var(--f-mono);font-size:10px;letter-spacing:.28em;
      text-transform:uppercase;color:var(--text3);margin-top:.4rem;
    }
    .btn-add{
      display:flex;align-items:center;gap:.55rem;
      padding:.65rem 1.5rem;background:var(--red);color:#fff;
      font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;
      text-transform:uppercase;border:none;cursor:pointer;
      transition:all .25s;border-radius:3px;
    }
    .btn-add:hover{background:#b8302a;transform:translateY(-1px);}
    .btn-add svg{width:15px;height:15px;}

    .btn{
      display:flex;align-items:center;gap:.5rem;
      padding:.55rem 1.2rem;
      font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
      text-transform:uppercase;border-radius:3px;transition:all .25s;cursor:pointer;
    }
    .btn-primary{background:var(--red);color:#fff;border:none;}
    .btn-primary:hover{background:#b8302a;transform:translateY(-1px);}
    .btn-secondary{border:1px solid var(--border-m);color:var(--text2);background:transparent;}
    .btn-secondary:hover{border-color:var(--red);color:var(--red);}
    .btn-sm{padding:.4rem .9rem;font-size:9px;}
    .btn-danger{background:var(--danger);color:#fff;border:none;}
    .btn-danger:hover{background:#b8302a;}

    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;margin-bottom:2.4rem;}
    .scard{
      background:var(--card);border:1px solid var(--border);
      padding:1.4rem 1.6rem;border-radius:4px;
      position:relative;overflow:hidden;
      transition:var(--tt),box-shadow .3s,transform .3s;
    }
    .scard:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
    .scard::after{
      content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
      background:transparent;transition:background .3s;
    }
    .scard:hover::after{background:var(--red);}
    .sc-lbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--text3);margin-bottom:.6rem;}
    .sc-val{font-family:var(--f-serif);font-size:2.6rem;font-weight:300;color:var(--text);line-height:1;}
    .sc-sub{font-size:.82rem;color:var(--text3);margin-top:.4rem;font-weight:400;}

    @media(max-width:900px){.stats-row{grid-template-columns:1fr 1fr;}}
    @media(max-width:480px){.stats-row{grid-template-columns:1fr;}}

    .panel{
      background:var(--card);border:1px solid var(--border);
      border-radius:4px;margin-bottom:2rem;overflow:hidden;
    }
    .panel-header{
      padding:1.2rem 1.5rem;border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;
    }
    .panel-title{font-size:1rem;font-weight:600;color:var(--text);}
    .panel-body{padding:1.5rem;}

    .table-wrap{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;}
    th{
      text-align:left;padding:.9rem 1rem;
      font-family:var(--f-mono);font-size:9px;letter-spacing:.2em;
      text-transform:uppercase;color:var(--text3);
      border-bottom:1px solid var(--border);font-weight:400;
    }
    td{
      padding:.9rem 1rem;border-bottom:1px solid var(--border);
      font-size:.9rem;color:var(--text2);
    }
    tr:hover td{background:var(--bg2);}
    .td-actions{display:flex;gap:.4rem;}
    .td-badge{
      display:inline-block;padding:.2rem .7rem;border-radius:2px;
      font-family:var(--f-mono);font-size:8px;letter-spacing:.14em;
      text-transform:uppercase;
    }
    .badge-portfolio{background:var(--rdim);color:var(--red);}

    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;}
    .form-full{grid-column:1/-1;}
    .form-group{display:flex;flex-direction:column;gap:.4rem;}
    .form-label{
      font-family:var(--f-mono);font-size:9px;letter-spacing:.18em;
      text-transform:uppercase;color:var(--text3);
    }
    .form-input,.form-textarea,.form-select{
      width:100%;background:transparent;border:1px solid var(--border-m);
      padding:.7rem 1rem;font-size:.9rem;color:var(--text);
      outline:none;transition:border-color .25s;border-radius:3px;
    }
    .form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--red);}
    .form-textarea{resize:vertical;min-height:100px;}
    .form-select{background:var(--bg3);appearance:none;cursor:pointer;}
    .form-hint{font-size:.75rem;color:var(--text3);margin-top:.2rem;}

    .search-bar{display:flex;gap:.5rem;margin-bottom:1.2rem;}
    .search-input{
      flex:1;background:transparent;border:1px solid var(--border-m);
      padding:.6rem 1rem;font-size:.88rem;color:var(--text);
      outline:none;border-radius:3px;transition:border-color .25s;
    }
    .search-input:focus{border-color:var(--red);}

    .empty-state{
      text-align:center;padding:5rem 2rem;
      font-family:var(--f-mono);font-size:10px;letter-spacing:.28em;
      text-transform:uppercase;color:var(--text3);
    }

    /* Modal */
    .modal-overlay{
      position:fixed;inset:0;
      background:rgba(10,9,8,.9);backdrop-filter:blur(18px);
      z-index:900;display:flex;align-items:center;justify-content:center;
      padding:1.5rem;opacity:0;visibility:hidden;pointer-events:none;
      transition:opacity .35s,visibility .35s;
    }
    .modal-overlay.open{opacity:1;visibility:visible;pointer-events:auto;}
    .modal{
      background:var(--card);border:1px solid var(--border-m);
      padding:2.5rem;border-radius:6px;
      width:100%;max-width:550px;position:relative;overflow:hidden;
      box-shadow:var(--shadow-lg);
      max-height:85vh;overflow-y:auto;
    }
    .modal::before{
      content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--red);
    }
    .modal-tag{
      font-family:var(--f-mono);font-size:10px;letter-spacing:.38em;
      text-transform:uppercase;color:var(--red);
      text-align:center;display:block;margin-bottom:.5rem;
    }
    .modal-title{
      font-family:var(--f-serif);font-size:2.2rem;font-weight:300;
      text-align:center;margin-bottom:2rem;line-height:1.1;
    }
    .modal-close{
      position:absolute;top:1rem;right:1rem;
      width:36px;height:36px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      color:var(--text3);transition:all .25s;
      background:var(--bg3);border:1px solid var(--border);
    }
    .modal-close:hover{background:var(--red);color:#fff;border-color:var(--red);}
    .modal-footer{display:flex;justify-content:flex-end;gap:.7rem;margin-top:2rem;}

    .toast-container{
      position:fixed;top:1.5rem;right:1.5rem;z-index:950;
      display:flex;flex-direction:column;gap:.6rem;
    }
    .toast{
      padding:1rem 1.5rem;border-radius:3px;
      font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;
      text-transform:uppercase;color:#fff;
      animation:slideIn .3s var(--ease);
      box-shadow:var(--shadow);
    }
    .toast-success{background:var(--success);}
    .toast-error{background:var(--danger);}
    @keyframes slideIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}
  </style>
</head>
<body>

<div class="noise" aria-hidden="true"></div>
<div class="toast-container" id="toast-container"></div>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-wrap">
    <div class="auth-logo">
      <span>Geek Studio</span>
    </div>
    <div class="auth-card">
      <span class="auth-tag">Restricted Access</span>
      <h1 class="auth-title">Command Center.</h1>
      <form id="login-form" autocomplete="on">
        <div class="auth-field">
          <label class="auth-flbl" for="email">Admin Email</label>
          <input type="email" id="email" class="auth-inp" placeholder="admin@geekstudio.co.tz" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label class="auth-flbl" for="password">Password</label>
          <input type="password" id="password" class="auth-inp" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="auth-btn" id="auth-btn">Authenticate →</button>
        <p class="auth-err" id="auth-error"></p>
      </form>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:flex;">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">Geek Studio</div>
      <span class="sb-tagline">Command Center</span>
    </div>
    <div class="sb-body">
      <div class="sb-section">
        <div class="sb-section-lbl">Content</div>
        <div class="sb-link active" data-panel="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </div>
        <div class="sb-link" data-panel="portfolio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          Portfolio
        </div>
        <div class="sb-link" data-panel="blog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Blog
        </div>
        <div class="sb-link" data-panel="media">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Media Library
        </div>
      </div>
      <div class="sb-section">
        <div class="sb-section-lbl">Site</div>
        <a href="index.html" target="_blank" class="sb-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Homepage ↗
        </a>
        <a href="portfolio.html" target="_blank" class="sb-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          Portfolio ↗
        </a>
        <a href="contact.html" target="_blank" class="sb-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Contact ↗
        </a>
      </div>
    </div>
    <div class="sb-foot">
      <button class="sb-foot-btn" id="logout-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
      <button class="sb-foot-btn" id="theme-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        Theme
      </button>
    </div>
  </aside>

  <button id="sb-toggle" aria-label="Menu">

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">

</div>

<script>
// ═══ SUPABASE INIT ═══
const SUPABASE_URL = 'https://epdzpxglpggdcdpekpxk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwZHpweGdscGdnZGNkcGVrcHhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTY5MDY3MjIsImV4cCI6MjAzMjQ4MjcyMn0.sjYm8XMtGcPMqLQmDrfZLXyDWpJz3zR3wXh0c0o6VRo';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ═══ STATE ═══
let currentPanel = 'dashboard';
let editingId = null;

// ═══ TOAST ═══
function toast(msg, type = 'success') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ═══ MODAL ═══
function openModal(title, tag, bodyHTML, footerHTML) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-tag').textContent = tag;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal-footer').innerHTML = footerHTML || '';
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

// ═══ AUTH ═══
async function checkSession() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    loadPanel('dashboard');
  }
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('auth-error');
  const btn = document.getElementById('auth-btn');
  
  btn.textContent = 'Authenticating...';
  btn.disabled = true;
  
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  
  if (error) {
    err.style.display = 'block';
    err.textContent = error.message;
    btn.textContent = 'Authenticate →';
    btn.disabled = false;
  } else {
    err.style.display = 'none';
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    loadPanel('dashboard');
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await supabase.auth.signOut();
  location.reload();
});

// Check session on load
checkSession();

// ═══ SIDEBAR ═══
document.querySelectorAll('.sb-link[data-panel]').forEach(link => {
  link.addEventListener('click', () => {
    document.querySelectorAll('.sb-link[data-panel]').forEach(l => l.classList.remove('active'));
    link.classList.add('active');
    loadPanel(link.dataset.panel);
    document.getElementById('sidebar').classList.remove('open');
  });
});

document.getElementById('sb-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

document.getElementById('theme-toggle').addEventListener('click', () => {
  const html = document.documentElement;
  const t = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', t);
  localStorage.setItem('gs-theme', t);
});

// ═══ PANEL LOADER ═══
async function loadPanel(panel) {
  currentPanel = panel;
  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="empty-state">Loading...</div>';

  switch (panel) {
    case 'dashboard': await loadDashboard(); break;
    case 'portfolio': await loadPortfolio(); break;
    case 'blog': await loadBlog(); break;
    case 'media': await loadMedia(); break;
  }
}

// ═══ DASHBOARD ═══
async function loadDashboard() {
  const main = document.getElementById('main-content');
  
  let projectCount = 0, blogCount = 0, mediaCount = 0;
  try {
    const { count: pc } = await supabase.from('projects').select('*', { count: 'exact', head: true });
    projectCount = pc || 0;
  } catch(e) {}
  try {
    const { count: bc } = await supabase.from('blog_posts').select('*', { count: 'exact', head: true });
    blogCount = bc || 0;
  } catch(e) {}
  try {
    const { count: mc } = await supabase.from('media').select('*', { count: 'exact', head: true });
    mediaCount = mc || 0;
  } catch(e) {}

  main.innerHTML = `
    <div class="topbar">
      <div>
        <h2 class="tb-title">Command Center</h2>
        <p class="tb-sub">Welcome back. The site is live.</p>
      </div>
      <button class="btn-add" onclick="openAddProjectModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Project
      </button>
    </div>

    <div class="stats-row">
      <div class="scard">
        <div class="sc-lbl">Portfolio Items</div>
        <div class="sc-val">${projectCount}</div>
        <div class="sc-sub">Live on site</div>
      </div>
      <div class="scard">
        <div class="sc-lbl">Blog Posts</div>
        <div class="sc-val">${blogCount}</div>
        <div class="sc-sub">Published</div>
      </div>
      <div class="scard">
        <div class="sc-lbl">Media Files</div>
        <div class="sc-val">${mediaCount}</div>
        <div class="sc-sub">Images & videos</div>
      </div>
      <div class="scard">
        <div class="sc-lbl">Site Status</div>
        <div class="sc-val" style="color:var(--success);">● Live</div>
        <div class="sc-sub">All systems go</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><h3 class="panel-title">Quick Actions</h3></div>
      <div class="panel-body" style="display:flex;gap:1rem;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="openAddProjectModal()">+ New Portfolio Item</button>
        <button class="btn btn-secondary" onclick="openAddBlogModal()">+ New Blog Post</button>
        <a href="index.html" target="_blank" class="btn btn-secondary">View Live Site ↗</a>
        <a href="portfolio.html" target="_blank" class="btn btn-secondary">View Portfolio ↗</a>
      </div>
    </div>
  `;
}

// ═══ PORTFOLIO ═══
async function loadPortfolio() {
  const main = document.getElementById('main-content');
  
  let projects = [];
  try {
    const { data, error } = await supabase.from('projects').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    projects = data || [];
  } catch(e) {
    console.error(e);
    toast('Failed to load projects', 'error');
  }

  main.innerHTML = `
    <div class="topbar">
      <div>
        <h2 class="tb-title">Portfolio Manager</h2>
        <p class="tb-sub">${projects.length} projects · Editing updates the live site instantly</p>
      </div>
      <button class="btn-add" onclick="openAddProjectModal()">+ New Project</button>
    </div>
    <div class="panel">
      <div class="panel-body">
        <div class="search-bar">
          <input type="text" class="search-input" placeholder="Search projects..." id="portfolio-search" oninput="filterTable('portfolio-table', this.value)">
        </div>
        <div class="table-wrap">
          <table id="portfolio-table">
            <thead>
              <tr><th>Title</th><th>Category</th><th>Type</th><th>Date</th><th>Actions</th></tr>
            </thead>
            <tbody>
              ${projects.length === 0 ? `<tr><td colspan="5"><div class="empty-state">No projects yet</div></td></tr>` :
              projects.map(p => `
                <tr>
                  <td><strong>${p.title || 'Untitled'}</strong></td>
                  <td><span class="td-badge badge-portfolio">${p.category || 'Uncategorized'}</span></td>
                  <td>${p.type || 'portfolio'}</td>
                  <td>${new Date(p.created_at).toLocaleDateString()}</td>
                  <td class="td-actions">
                    <button class="btn btn-sm btn-secondary" onclick="editProject('${p.id}')">Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteProject('${p.id}')">Delete</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function filterTable(tableId, query) {
  const q = query.toLowerCase();
  document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function openAddProjectModal() {
  editingId = null;
  openModal('New Project.', 'Portfolio Update', `
    <form id="project-form">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Title *</label><input type="text" class="form-input" id="proj-title" placeholder="e.g. Saadka Logistics" required></div>
        <div class="form-group"><label class="form-label">Category *</label><input type="text" class="form-input" id="proj-category" placeholder="e.g. Brand Identity" required></div>
        <div class="form-group"><label class="form-label">Image URL</label><input type="text" class="form-input" id="proj-image" placeholder="https://..."></div>
        <div class="form-group"><label class="form-label">Video URL</label><input type="text" class="form-input" id="proj-video" placeholder="https://..."></div>
        <div class="form-group"><label class="form-label">Type</label><select class="form-select" id="proj-type"><option value="portfolio">Portfolio</option><option value="featured">Featured</option></select></div>
        <div class="form-group"><label class="form-label">Live Link</label><input type="text" class="form-input" id="proj-link" placeholder="https://..."></div>
      </div>
    </form>
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveProject()">Deploy to Live Site →</button>
  `);
}

async function saveProject() {
  const title = document.getElementById('proj-title').value.trim();
  const category = document.getElementById('proj-category').value.trim();
  const image_url = document.getElementById('proj-image').value.trim();
  const video_url = document.getElementById('proj-video').value.trim();
  const type = document.getElementById('proj-type').value;
  const link = document.getElementById('proj-link').value.trim();

  if (!title || !category) { toast('Title and category required', 'error'); return; }

  try {
    if (editingId) {
      const { error } = await supabase.from('projects').update({ title, category, image_url, video_url, type, link }).eq('id', editingId);
      if (error) throw error;
      toast('Project updated! Live on site.', 'success');
    } else {
      const { error } = await supabase.from('projects').insert([{ title, category, image_url, video_url, type, link }]);
      if (error) throw error;
      toast('Project created! Live on site.', 'success');
    }
    closeModal();
    loadPortfolio();
  } catch(e) {
    toast('Error saving project', 'error');
    console.error(e);
  }
}

async function editProject(id) {
  try {
    const { data, error } = await supabase.from('projects').select('*').eq('id', id).single();
    if (error) throw error;
    editingId = id;
    openModal('Edit Project.', 'Portfolio Update', `
      <form id="project-form">
        <div class="form-grid">
          <div class="form-group"><label class="form-label">Title *</label><input type="text" class="form-input" id="proj-title" value="${data.title || ''}" required></div>
          <div class="form-group"><label class="form-label">Category *</label><input type="text" class="form-input" id="proj-category" value="${data.category || ''}" required></div>
          <div class="form-group"><label class="form-label">Image URL</label><input type="text" class="form-input" id="proj-image" value="${data.image_url || ''}"></div>
          <div class="form-group"><label class="form-label">Video URL</label><input type="text" class="form-input" id="proj-video" value="${data.video_url || ''}"></div>
          <div class="form-group"><label class="form-label">Type</label><select class="form-select" id="proj-type"><option value="portfolio" ${data.type==='portfolio'?'selected':''}>Portfolio</option><option value="featured" ${data.type==='featured'?'selected':''}>Featured</option></select></div>
          <div class="form-group"><label class="form-label">Live Link</label><input type="text" class="form-input" id="proj-link" value="${data.link || ''}"></div>
        </div>
      </form>
    `, `
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveProject()">Update Project</button>
    `);
  } catch(e) {
    toast('Error loading project', 'error');
  }
}

async function deleteProject(id) {
  if (!confirm('Delete this project? This cannot be undone.')) return;
  try {
    const { error } = await supabase.from('projects').delete().eq('id', id);
    if (error) throw error;
    toast('Project deleted', 'success');
    loadPortfolio();
  } catch(e) {
    toast('Error deleting', 'error');
  }
}

// ═══ BLOG ═══
async function loadBlog() {
  const main = document.getElementById('main-content');
  
  let posts = [];
  try {
    const { data, error } = await supabase.from('blog_posts').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    posts = data || [];
  } catch(e) {
    console.error(e);
  }

  main.innerHTML = `
    <div class="topbar">
      <div>
        <h2 class="tb-title">Blog</h2>
        <p class="tb-sub">${posts.length} posts · Write, edit, and publish</p>
      </div>
      <button class="btn-add" onclick="openAddBlogModal()">+ New Post</button>
    </div>
    ${posts.length === 0 ? `<div class="empty-state">No blog posts yet. Start writing.</div>` :
    posts.map(p => `
      <div class="panel" style="margin-bottom:1rem;">
        <div class="panel-header">
          <h3 class="panel-title">${p.title || 'Untitled'}</h3>
          <span style="font-family:var(--f-mono);font-size:9px;color:var(--text3);">${new Date(p.created_at).toLocaleDateString()}</span>
        </div>
        <div class="panel-body">
          <p style="color:var(--text2);line-height:1.6;">${(p.content || '').substring(0, 300)}...</p>
        </div>
        <div style="padding:0 1.5rem 1.2rem;display:flex;gap:.5rem;">
          <button class="btn btn-sm btn-secondary" onclick="editBlogPost('${p.id}')">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteBlogPost('${p.id}')">Delete</button>
        </div>
      </div>
    `).join('')}
  `;
}

function openAddBlogModal() {
  editingId = null;
  openModal('New Blog Post.', 'Content Update', `
    <form id="blog-form">
      <div class="form-group" style="margin-bottom:1rem;"><label class="form-label">Title *</label><input type="text" class="form-input" id="blog-title" placeholder="Post title..." required></div>
      <div class="form-group" style="margin-bottom:1rem;"><label class="form-label">Content *</label><textarea class="form-textarea" id="blog-content" placeholder="Write your post..." rows="10" required></textarea></div>
      <div class="form-group"><label class="form-label">Featured Image URL</label><input type="text" class="form-input" id="blog-image" placeholder="https://..."></div>
    </form>
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveBlogPost()">Publish Post</button>
  `);
}

async function saveBlogPost() {
  const title = document.getElementById('blog-title').value.trim();
  const content = document.getElementById('blog-content').value.trim();
  const image_url = document.getElementById('blog-image').value.trim();
  if (!title || !content) { toast('Title and content required', 'error'); return; }
  try {
    if (editingId) {
      await supabase.from('blog_posts').update({ title, content, image_url }).eq('id', editingId);
    } else {
      await supabase.from('blog_posts').insert([{ title, content, image_url }]);
    }
    toast('Post saved!', 'success');
    closeModal();
    loadBlog();
  } catch(e) {
    toast('Error saving post', 'error');
  }
}

async function editBlogPost(id) {
  const { data } = await supabase.from('blog_posts').select('*').eq('id', id).single();
  editingId = id;
  openModal('Edit Post.', 'Content Update', `
    <form id="blog-form">
      <div class="form-group" style="margin-bottom:1rem;"><label class="form-label">Title *</label><input type="text" class="form-input" id="blog-title" value="${data.title || ''}" required></div>
      <div class="form-group" style="margin-bottom:1rem;"><label class="form-label">Content *</label><textarea class="form-textarea" id="blog-content" rows="10" required>${data.content || ''}</textarea></div>
      <div class="form-group"><label class="form-label">Featured Image URL</label><input type="text" class="form-input" id="blog-image" value="${data.image_url || ''}"></div>
    </form>
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveBlogPost()">Update Post</button>
  `);
}

async function deleteBlogPost(id) {
  if (!confirm('Delete this post?')) return;
  await supabase.from('blog_posts').delete().eq('id', id);
  toast('Post deleted', 'success');
  loadBlog();
}

// ═══ MEDIA ═══
async function loadMedia() {
  const main = document.getElementById('main-content');
  
  let media = [];
  try {
    const { data, error } = await supabase.from('media').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    media = data || [];
  } catch(e) {
    console.error(e);
  }

  main.innerHTML = `
    <div class="topbar">
      <div>
        <h2 class="tb-title">Media Library</h2>
        <p class="tb-sub">${media.length} files · Click to copy URL</p>
      </div>
      <button class="btn-add" onclick="openAddMediaModal()">+ Add Media</button>
    </div>
    <div class="panel">
      <div class="panel-body">
        ${media.length === 0 ? `<div class="empty-state">No media files yet</div>` :
        `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;">
          ${media.map(m => `
            <div style="aspect-ratio:1;background:var(--bg3);border:1px solid var(--border);border-radius:4px;overflow:hidden;cursor:pointer;position:relative;" onclick="copyToClipboard('${m.url}')" title="Click to copy URL">
              <img src="${m.url}" alt="${m.name}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
              <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.8);padding:.4rem;font-family:var(--f-mono);font-size:7px;letter-spacing:.1em;text-transform:uppercase;text-align:center;color:var(--text2);">${m.name || 'File'}</div>
            </div>
          `).join('')}
        </div>`}
      </div>
    </div>
  `;
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => toast('URL copied!', 'success'));
}

function openAddMediaModal() {
  openModal('Add Media.', 'Media Library', `
    <form id="media-form">
      <div class="form-group" style="margin-bottom:1rem;"><label class="form-label">Name</label><input type="text" class="form-input" id="media-name" placeholder="e.g. hero-banner" required></div>
      <div class="form-group"><label class="form-label">URL *</label><input type="text" class="form-input" id="media-url" placeholder="https://..." required></div>
    </form>
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveMedia()">Add Media</button>
  `);
}

async function saveMedia() {
  const name = document.getElementById('media-name').value.trim();
  const url = document.getElementById('media-url').value.trim();
  if (!name || !url) { toast('Name and URL required', 'error'); return; }
  try {
    await supabase.from('media').insert([{ name, url }]);
    toast('Media added!', 'success');
    closeModal();
    loadMedia();
  } catch(e) {
    toast('Error adding media', 'error');
  }
}
</script>
